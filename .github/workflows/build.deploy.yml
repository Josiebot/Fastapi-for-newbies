name: Build and Deploy Code

on: [push, pull_request]
# env: 
#   DATABASE_HOSTNAME: localhost 
# I can Use this env here if I have shared variables for job 1 and job 2 or more
jobs: 
  build:
    environment:
      name: testing
    env:
      DATABASE_HOSTNAME: ${{secrets.DATABASE_HOSTNAME}}
      DATABASE_PORT: ${{secrets.DATABASE_PORT}}
      DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
      DATABASE_NAME: ${{secrets.DATABASE_NAME}}
      DATABASE_USERNAME: ${{secrets.DATABASE_USERNAME}}
      SECRET_KEY: ${{secrets.SECRET_KEY}}
      ALGORITHM: ${{secrets.ALGORITHM}}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{secrets.ACCESS_TOKEN_EXPIRE_MINUTES}}
    
    # The services part here says Meaning:Before you run my tests, start a temporary PostgreSQL container for me.
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
          POSTGRES_DB: ${{secrets.DATABASE_NAME}}_test
        ports:
        - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    runs-on: ubuntu-latest
    steps: 
      - name: pulling git repo
        uses: actions/checkout@v2
        # tHIS SAya Download/check out my GitHub repository onto the GitHub Actions machine.
      # - name: say hi to Jossy
      #   run: echo "you are getting there Jossy"
      - name: Install python version 3.11
        uses: actions/setup-python@v2
        # here the uses command means Install/set up Python 3.11  on the GitHub Actions machine. @v2 Version of the GitHub Action itself

        with: 
          python-version: "3.11"
      - name: update pip
        run: python -m pip install --upgrade pip
      - name: install all dependencies
        run: pip install -r requirements.txt
      
      - name: test with pytest
        run: |
          pip install pytest
          pytest
        
