name: Build and Deploy Code

on: [push, pull_request]

jobs: 
  job1:
    runs-on: ubuntu-latest
    steps: 
      - name: pulling git repo
        uses: actions/checkout@v2
        # tHIS SAya Download/check out my GitHub repository onto the GitHub Actions machine.
      # - name: say hi to Jossy
      #   run: echo "you are getting there Jossy"
      - name: Install python version 3.11
        uses: actions/setup-python@v2
        # here the uses command means Install/set up Python 3.11  on the GitHub Actions machine. @v2 Version of the GitHub Action itself

        with: 
          python-version: "3.11"
      - name: update pip
        run: python -m pip install --upgrade pip
      - name: install all dependencies
        run: pip install -r requirements.txt
      - name: test with pytest
        run: |
          pip install pytest
          pytest


# “Whenever someone pushes code or creates a pull request, start an Ubuntu machine, download my code, install Python 3.9, update pip, and install all the project's dependencies.”








